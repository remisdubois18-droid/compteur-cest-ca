name: Volume Clicker - Android APK
on:
  push:
    branches: [main]
    paths:
      - 'volume-clicker-android/**'
      - '.github/workflows/volume-clicker-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: volume-clicker-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../compteur-volume.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VolumeClicker-APK
          path: compteur-volume.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compteur-volume-v3.${{ github.run_number }}
          name: Compteur (touches de volume) – version 3.${{ github.run_number }}
          body: Télécharger compteur-volume.apk depuis le téléphone, puis l'ouvrir pour l'installer.
          files: compteur-volume.apk
