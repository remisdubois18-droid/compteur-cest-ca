name: Fabriquer l'APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'pc/**', '.github/workflows/fabriquer-windows.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Récupérer le moteur Whisper (whisper.cpp)
        run: git clone --depth 1 --branch v1.7.5 https://github.com/ggml-org/whisper.cpp.git whisper.cpp

      - name: Récupérer les modèles de reconnaissance Whisper
        run: |
          mkdir -p app/src/main/assets/whisper
          curl -sSfL -o app/src/main/assets/whisper/ggml-small.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q8_0.bin
          curl -sSfL -o app/src/main/assets/whisper/ggml-base.bin  https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q8_0.bin
          ls -la app/src/main/assets/whisper

      - name: Compiler l'application
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renommer le fichier
        run: cp app/build/outputs/apk/release/app-release.apk compteur-cest-ca.apk && ls -la compteur-cest-ca.apk

      - name: Garder l'APK dans l'exécution
        uses: actions/upload-artifact@v4
        with:
          name: compteur-cest-ca
          path: compteur-cest-ca.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: Compteur c'est ça – version 2.${{ github.run_number }}
          body: Télécharger compteur-cest-ca.apk depuis le téléphone, puis l'ouvrir pour l'installer.
          files: compteur-cest-ca.apk
