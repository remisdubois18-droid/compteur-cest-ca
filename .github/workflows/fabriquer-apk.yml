name: Fabriquer l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Récupérer le modèle de reconnaissance français (hors connexion)
        run: |
          curl -sSL -o modele.zip https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip
          unzip -q modele.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-fr-0.22 app/src/main/assets/model-fr
          uuidgen > app/src/main/assets/model-fr/uuid
          echo "--- Mots du vocabulaire contenant c'est / ça :"
          find app/src/main/assets/model-fr -name 'words.txt' -exec grep -E "^(c'est|c'|ça|sa|ca|est) " {} \; || true
          ls -R app/src/main/assets/model-fr | head -40

      - name: Compiler l'application
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renommer le fichier
        run: cp app/build/outputs/apk/debug/app-debug.apk compteur-cest-ca.apk

      - name: Garder l'APK dans l'exécution
        uses: actions/upload-artifact@v4
        with:
          name: compteur-cest-ca
          path: compteur-cest-ca.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Compteur c'est ça – version 1.${{ github.run_number }}
          body: Télécharger compteur-cest-ca.apk depuis le téléphone, puis l'ouvrir pour l'installer.
          files: compteur-cest-ca.apk
